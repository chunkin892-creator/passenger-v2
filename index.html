function showToast(m,d){if(!d)d=3000;const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(e._timer);e._timer=setTimeout(()=>e.classList.remove('show'),d);}

function getDir(t){return parseInt(t.split(':')[0])<12?'morning':'evening';}

function playBoostedAudio(b,boost){if(!b)return;const a=boost||CONFIG.VOICE_MSG_BOOST;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));ctx.decodeAudioData(bytes.buffer,buf=>{const s=ctx.createBufferSource();s.buffer=buf;const g=ctx.createGain();g.gain.value=a;s.connect(g);g.connect(ctx.destination);s.start(0);},()=>{const au=new Audio('data:audio/webm;base64,'+b);au.volume=0.7;au.play().catch(()=>{});});}catch(e){const au=new Audio('data:audio/webm;base64,'+b);au.volume=0.7;au.play().catch(()=>{});}}
function loadBusList(){const c=document.getElementById('bus-list-container');if(!c)return;c.textContent='載入中…';if(busListRef){try{busListRef.off();}catch(e){}}busListRef=db.ref('van/active_buses');busListRef.on('value',snap=>{const d=snap.val()||{};let cnt=0,nw=nowMs();const frag=document.createDocumentFragment();Object.keys(d).forEach(p=>{const b=d[p];if(nw-(b.lastUpdate||0)>CONFIG.ACTIVE_BUS_TIMEOUT)return;cnt++;const card=document.createElement('div');card.className='card';card.style.padding='14px';const tt=document.createElement('div');tt.style.cssText='font-size:22px;font-weight:bold;color:#fc0;';tt.textContent='🚐 '+p;card.appendChild(tt);const info=document.createElement('div');info.style.cssText='font-size:16px;color:#ccc;margin-top:6px;';info.textContent=(b.currentStation||'未知')+' · 👥 '+(b.passengerCount||0)+'人';card.appendChild(info);const btn=document.createElement('button');btn.className='btn btn-primary';btn.style.cssText='margin-top:10px;font-size:16px;padding:12px;';btn.textContent='追蹤';btn.addEventListener('click',()=>trackBus(p));card.appendChild(btn);frag.appendChild(card);});c.innerHTML='';if(cnt===0){const e=document.createElement('div');e.style.cssText='text-align:center;color:#888;font-size:16px;padding:20px;';e.textContent='沒有活躍車輛';c.appendChild(e);}else{c.appendChild(frag);}});}
function trackBus(plate){currentBusId=plate;showView('view-passenger');const card=document.getElementById('pass-data-card');if(!card)return;card.textContent='讀取中…';passengerLastStationIndex=-1;passengerVoiceEnabled=localStorage.getItem('passengerVoice')==='true';const vb=document.getElementById('voice-toggle');if(vb){vb.textContent=passengerVoiceEnabled?'🔊 廣東話自動報站 (已開啟)':'🔊 開啟廣東話自動報站';vb.style.background=passengerVoiceEnabled?'var(--green)':'#ff9f0a';vb.style.color=passengerVoiceEnabled?'#fff':'#000';const nb=vb.cloneNode(true);vb.parentNode.replaceChild(nb,vb);nb.addEventListener('click',function(){passengerVoiceEnabled=!passengerVoiceEnabled;localStorage.setItem('passengerVoice',passengerVoiceEnabled?'true':'false');if(passengerVoiceEnabled){this.style.background='var(--green)';this.style.color='#fff';this.textContent='🔊 廣東話自動報站 (已開啟)';showToast('✅ 自動報站已開啟');if(voiceEnabled)speakCantonese(VOICE_TEXTS.announce);}else{this.style.background='#ff9f0a';this.style.color='#000';this.textContent='🔊 開啟廣東話自動報站';showToast('⏸️ 自動報站已關閉');if(voiceEnabled)speakCantonese(VOICE_TEXTS.announceOff);}});}if(passengerMsgRef){try{passengerMsgRef.off();}catch(e){}}if(passengerBusRef){try{passengerBusRef.off();}catch(e){}}passengerBusRef=db.ref('van/active_buses/'+plate);passengerBusRef.on('value',snap=>{if(!document.getElementById('view-passenger').classList.contains('active'))return;const bus=snap.val();if(!bus){card.textContent='車輛已離線';return;}const ci=bus.stationIndex||0;const rt=getRouteArr(bus.mode,bus.direction);const cs=rt[ci]||'未知';const ni=ci+1<rt.length?ci+1:0;const ns=rt[ni]||'終點';card.innerHTML='';const t1=document.createElement('div');t1.style.cssText='font-size:22px;font-weight:bold;color:#fc0;';t1.textContent='🚐 '+plate;card.appendChild(t1);const t2=document.createElement('div');t2.className='station-name';t2.textContent=cs;card.appendChild(t2);const t3=document.createElement('div');t3.style.cssText='font-size:44px;font-weight:800;color:#fc0;text-align:center;margin:6px 0;';t3.textContent=bus.isFull?'🚫 滿座':((bus.passengerCount||0)+' 人');card.appendChild(t3);const t4=document.createElement('div');t4.style.cssText='font-size:16px;color:#aaa;text-align:center;';t4.textContent='下一站：'+ns+' · 方向：'+(bus.direction===0?'往元朗':'往大棠');card.appendChild(t4);renderPassRouteStrip(bus,rt);if(passengerVoiceEnabled&&ci!==passengerLastStationIndex&&voiceEnabled&&!voiceLock){passengerLastStationIndex=ci;if(ns!=='終點')speakWithDelay(VOICE_TEXTS.arrived+cs,VOICE_TEXTS.nextStation+ns);else speakCantonese(VOICE_TEXTS.arrived+cs).then(()=>setTimeout(()=>speakCantonese(VOICE_TEXTS.lastStation),2000));}});passengerMsgRef=db.ref('van/messages').orderByChild('busId').equalTo(plate);passengerMsgRef.on('value',snap=>{const list=document.getElementById('pass-msg-list');if(!list)return;list.innerHTML='';const items=[];snap.forEach(ch=>{const m=ch.val();if(m.hidden)return;items.push({key:ch.key,msg:m});});items.sort((a,b)=>b.msg.timestamp-a.msg.timestamp);items.forEach(it=>{const m=it.msg,div=document.createElement('div');div.className='msg-row';const tS=document.createElement('span');tS.style.color='#888';tS.style.fontSize='12px';tS.textContent=m.timestamp?'['+new Date(m.timestamp).toLocaleTimeString('zh-HK')+'] ':'';div.appendChild(tS);if(m.audio){const b=document.createElement('button');b.className='play-audio';b.textContent='▶ 語音';b.addEventListener('click',()=>playBoostedAudio(m.audio));div.appendChild(b);}else{div.appendChild(document.createTextNode((m.senderIdentifier||'')+': '+(m.text||'(訊息)')));}list.appendChild(div);});});}
function renderPassRouteStrip(bus,rt){const strip=document.getElementById('pass-route-strip');if(!strip)return;strip.innerHTML='';const current=bus.stationIndex||0;rt.forEach((name,idx)=>{const node=document.createElement('div');node.className='dot-node';if(idx<current)node.classList.add('passed');else if(idx===current)node.classList.add('current');else if(idx===current+1)node.classList.add('next');const dot=document.createElement('div');dot.className='dot';const sp=document.createElement('span');sp.textContent=name;node.appendChild(dot);node.appendChild(sp);strip.appendChild(node);});const cd=strip.querySelector('.dot-node.current');if(cd)setTimeout(()=>cd.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),100);}
async function renderBookingContent(){const c=document.getElementById('booking-content');if(!c)return;if(!currentPassenger||!currentPassenger.phone){c.innerHTML='<div class="card" style="text-align:center;color:#888;padding:20px;">請先登入乘客帳號</div>';return;}const phone=currentPassenger.phone;const pd=await db.ref('booking_passengers/'+phone).once('value').then(s=>s.val()||{});const cs=pd.creditScore!=null?pd.creditScore:100;const su=pd.suspendedUntil||0;const t=getToday();if(!isWeekday()){c.innerHTML='<div class="card"><div style="font-size:14px;font-weight:600;">📅 今日不設留座</div><div style="font-size:13px;color:#64748b;margin-top:6px;">星期六、日及公眾假期採循環線運作。</div></div>';return;}if(su>nowMs()){const r=Math.ceil((su-nowMs())/(24*60*60*1000));c.innerHTML='<div class="card" style="border-color:#ef4444;background:#450a0a;"><div style="font-size:14px;font-weight:600;color:#f87171;">⛔ 預約資格已暫停，剩餘 '+r+' 日</div></div>';return;}let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:15px;font-weight:600;">👤 '+esc(pd.name||currentPassenger.name||'')+'</div><div style="font-size:12px;color:#64748b;">'+esc(phone)+'</div></div><div style="text-align:right;"><div style="font-size:20px;font-weight:700;color:'+(cs>=80?'#22c55e':cs>=50?'#f59e0b':'#ef4444')+';">'+cs+'</div><div style="font-size:10px;color:#64748b;">信用分</div></div></div></div>';const tb=await db.ref('booking/'+t).once('value').then(s=>s.val()||{});const sc=await db.ref('booking_seats/'+t).once('value').then(s=>s.val()||{});h+='<div style="font-size:14px;font-weight:600;color:#94a3b8;margin:14px 0 10px;">🌅 早上固定班次 · 大棠黃泥墩開出</div>';SM.forEach(tm=>{h+=renderPaxShiftCard(t,tm,tb,sc);});if(isLoopHour()){h+='<div class="loop-card"><div class="title">🔄 循環線時段（07:00 - 18:00）</div><div class="sub">冇固定班次，可即時留位</div></div>';const lq=await db.ref('booking_loop/'+t).once('value').then(s=>s.val()||{});currentCachedLoop=lq;const lp=Object.values(lq).find(x=>x.phone===phone&&(x.status==='pending'||x.status==='reserved'));const wc=Object.values(lq).filter(x=>x.status==='pending').length;if(lp){const bt=lp.createdAt?new Date(lp.createdAt).toLocaleString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false}):'';if(lp.status==='pending'){h+='<div class="loop-card" style="background:linear-gradient(135deg,#431407,#7c2d12);border-color:#fb923c;"><div class="title" style="color:#fdba74;">⏳ 等待司機確認</div><div class="sub" style="color:#fed7aa;">'+(lp.pickupLocation?'📍 '+esc(lp.pickupLocation)+'<br>':'')+(bt?'⏰ '+bt+'<br>':'')+'前面仲有 <strong>'+Math.max(0,wc-1)+'</strong> 位</div><button class="btn btn-danger" style="margin-top:12px;padding:12px;font-size:14px;" onclick="paxLoopCancel()">取消留位</button></div>';}else{h+='<div class="loop-card" style="background:linear-gradient(135deg,#052e16,#065f46);border-color:#22c55e;"><div class="title" style="color:#4ade80;">✅ 已確認留位</div><div class="sub" style="color:#86efac;">'+(lp.pickupLocation?'📍 '+esc(lp.pickupLocation)+'<br>':'')+(bt?'⏰ '+bt+'<br>':'')+'請到站頭等候</div><button class="btn btn-green" style="margin-top:12px;padding:12px;font-size:14px;" onclick="paxLoopBoarded()">🚐 我已上車</button><button class="btn btn-outline" style="margin-top:8px;padding:12px;font-size:14px;" onclick="paxLoopCancel()">取消</button></div>';}}else{h+='<div class="loop-card"><div class="title">🔄 循環線留位</div><div class="sub">而家可以留位，司機確認後即可上車</div><label class="pax-label" style="color:#bae6fd;margin-top:10px;">📍 上車地點</label><input type="text" id="pax-loop-pickup" class="pax-input" placeholder="可自行輸入" maxlength="40" style="background:#0f172a;border-color:#0ea5e9;"><button class="btn btn-primary" style="padding:14px;font-size:14px;" onclick="paxLoopJoin()">✅ 立即留位</button></div>';}}h+='<div style="font-size:14px;font-weight:600;color:#94a3b8;margin:16px 0 10px;">🌆 傍晚固定班次 · 元朗港鐵站 H 出口開出</div>';SE.forEach(tm=>{h+=renderPaxShiftCard(t,tm,tb,sc);});const mb=Object.values(tb).filter(b=>b.passengerPhone===phone&&b.status!=='cancelled'&&b.status!=='rejected');if(mb.length>0){h+='<div style="font-size:14px;font-weight:600;color:#94a3b8;margin:16px 0 10px;">🎫 我的預約</div>';mb.sort((a,b)=>a.time.localeCompare(b.time));mb.forEach(b=>{const mm={pending:{text:'⏳ 待確認',color:'#fdba74',border:'#fb923c'},reserved:{text:'✅ 已確認',color:'#4ade80',border:'#22c55e'},arrived:{text:'✅ 已到站',color:'#4ade80',border:'#22c55e'},boarded:{text:'🚐 已上車',color:'#7dd3fc',border:'#38bdf8'},'no-show':{text:'❌ 未到站',color:'#f87171',border:'#ef4444'}};const s=mm[b.status]||{text:b.status,color:'#94a3b8',border:'#334155'};const pl=b.pickupLocation?'<div style="font-size:12px;color:#4ade80;margin-top:2px;">📍 '+esc(b.pickupLocation)+'</div>':'';h+='<div class="card" style="padding:12px;border-color:'+s.border+';"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:15px;font-weight:600;">'+esc(b.time)+' 班次</div><div style="font-size:12px;color:#64748b;">'+esc(getOrig(b.time))+' · '+b.seats+' 人</div>'+pl+'</div><div style="font-size:13px;color:'+s.color+';font-weight:700;">'+s.text+'</div></div>';if(b.status==='pending'||b.status==='reserved'||b.status==='arrived'){h+='<div style="display:flex;gap:6px;margin-top:8px;">';if(b.status==='reserved'||b.status==='arrived')h+='<button class="btn btn-green" style="padding:8px;font-size:13px;flex:1;" onclick="paxBoarded(\''+b.id+'\',\''+b.date+'\')">🚐 我已上車</button>';h+='<button class="btn btn-outline" style="padding:8px;font-size:13px;flex:1;" onclick="paxCancelBooking(\''+b.id+'\',\''+b.date+'\')">取消</button>';h+='</div>';}h+='</div>';});}c.innerHTML=h;}
function renderPaxShiftCard(d,t,ab,sc){const sid=d+'_'+t.replace(':','');const cfg=sc[t.replace(':','')];const dir=getDir(t);if(!cfg||!cfg.seats){return '<div class="pax-card full"><div><div class="time">'+esc(t)+'</div><div class="info">'+esc(getOrigL(t))+'</div><div style="margin-top:4px;font-size:11px;color:#ef4444;">未開放</div></div><div><div class="num zero">—</div></div></div>';}const quota=cfg.quota||cfg.seats;const used=Object.values(ab).filter(b=>b.scheduleId===sid&&['pending','reserved','arrived','boarded'].indexOf(b.status)>=0).reduce((s,b)=>s+(b.seats||0),0);const rem=quota-used;const full=rem<=0;const my=Object.values(ab).find(b=>b.scheduleId===sid&&b.passengerPhone===currentPassenger.phone&&b.status!=='cancelled'&&b.status!=='rejected'&&b.status!=='no-show');let bg='';if(my){if(my.status==='pending')bg='⏳ 待確認';else if(my.status==='reserved')bg='✅ 已確認';else if(my.status==='arrived')bg='已到站';else if(my.status==='boarded')bg='已上車';}const clk=!full||my;return '<div class="pax-card'+(full&&!my?' full':'')+'" '+(clk?'onclick="paxSelectShift(\''+d+'\',\''+t+'\')"':'')+'><div><div class="time">'+esc(t)+'</div><div class="info">'+esc(getOrigL(t))+'</div>'+(bg?'<div style="margin-top:4px;font-size:12px;color:#fdba74;font-weight:600;">'+bg+'</div>':'')+'<div style="font-size:10px;color:#64748b;margin-top:4px;">留位額：'+quota+' 個</div></div><div style="text-align:right;"><div class="num'+(rem<=0?' zero':'')+'">'+rem+'</div><div style="font-size:11px;color:#64748b;">剩餘</div></div></div>';}
async function paxSelectShift(d,t){const cfg=await db.ref('booking_seats/'+d+'/'+t.replace(':','')).once('value').then(s=>s.val());if(!cfg||!cfg.seats){showToast('此班次未開放');return;}const phone=currentPassenger.phone;const tb=await db.ref('booking/'+d).once('value').then(s=>s.val()||{});const sid=d+'_'+t.replace(':','');const my=Object.values(tb).find(b=>b.scheduleId===sid&&b.passengerPhone===phone&&b.status!=='cancelled'&&b.status!=='rejected'&&b.status!=='no-show');if(my){showToast('你已經預約咗呢個班次');return;}const pd=await db.ref('booking_passengers/'+phone).once('value').then(s=>s.val()||{});const isM=getDir(t)==='morning';const c=document.getElementById('booking-content');c.innerHTML='<div style="margin-bottom:12px;"><button class="btn btn-outline btn-sm" style="width:auto;padding:10px 16px;font-size:14px;" onclick="renderBookingContent()">← 返回</button></div><div class="card"><div style="font-size:26px;font-weight:700;color:#38bdf8;">'+esc(t)+'</div><div style="font-size:13px;margin-top:6px;font-weight:600;color:'+(isM?'#4ade80':'#fdba74')+';">'+esc(getOrigL(t))+'</div><div style="font-size:13px;color:#94a3b8;margin-top:4px;">→ '+esc(getDest(t))+'</div></div><div class="card"><label class="pax-label">姓名</label><input type="text" id="pax-book-name" class="pax-input" value="'+esc(pd.name||'')+'" maxlength="20"><label class="pax-label">人數</label><select id="pax-book-seats" class="pax-input"><option value="1">1 人</option><option value="2">2 人</option></select><label class="pax-label">📍 上車地點</label><input type="text" id="pax-book-pickup" class="pax-input" placeholder="可自行輸入" maxlength="40"><button class="btn btn-primary" id="pax-confirm-btn" style="padding:14px;font-size:14px;" onclick="paxConfirmBooking(\''+d+'\',\''+t+'\')">送出預約</button></div>';}
async function paxConfirmBooking(d,t){const btn=document.getElementById('pax-confirm-btn');if(btn){btn.disabled=true;btn.textContent='處理中...';}const name=document.getElementById('pax-book-name').value.trim();const seats=parseInt(document.getElementById('pax-book-seats').value);const pickup=document.getElementById('pax-book-pickup').value.trim();if(!name||!pickup){showToast('請填寫姓名同上車地點');if(btn){btn.disabled=false;btn.textContent='送出預約';}return;}try{const cfg=await db.ref('booking_seats/'+d+'/'+t.replace(':','')).once('value').then(s=>s.val());if(!cfg||!cfg.seats)throw new Error('此班次未開放');const quota=cfg.quota||cfg.seats;const sid=d+'_'+t.replace(':','');const tb=await db.ref('booking/'+d).once('value').then(s=>s.val()||{});const used=Object.values(tb).filter(b=>b.scheduleId===sid&&['pending','reserved','arrived','boarded'].indexOf(b.status)>=0).reduce((s,b)=>s+(b.seats||0),0);if(used+seats>quota)throw new Error('剩餘留位額不足');const today=getToday();const cc=await db.ref('booking_passengers/'+currentPassenger.phone+'/cancels/'+today).once('value').then(s=>s.val()||0);if(cc>=CONFIG.MAX_CANCEL_PER_DAY)throw new Error('今日取消次數已達上限');const b={scheduleId:sid,date:d,time:t,passengerName:name,passengerPhone:currentPassenger.phone,seats:seats,pickupLocation:pickup,status:'pending',direction:getDir(t)};const r=db.ref('booking/'+d).push();b.id=r.key;b.createdAt=nowMs();await r.set(b);showToast('✅ 已送出，等待司機確認',3000);renderBookingContent();}catch(e){showToast('❌ '+e.message,5000);if(btn){btn.disabled=false;btn.textContent='送出預約';}}}
async function paxLoopJoin(){try{const t=getToday();const all=await db.ref('booking_loop/'+t).once('value').then(s=>s.val()||{});const ex=Object.values(all).find(x=>x.phone===currentPassenger.phone&&(x.status==='pending'||x.status==='reserved'));if(ex){showToast('⚠️ 你已經留咗位');return;}const pickup=document.getElementById('pax-loop-pickup')?document.getElementById('pax-loop-pickup').value.trim():'';if(!pickup){showToast('請輸入上車地點');return;}const pd=await db.ref('booking_passengers/'+currentPassenger.phone).once('value').then(s=>s.val()||{});if((pd.creditScore||100)<50){showToast('⚠️ 信用分不足');return;}const r=db.ref('booking_loop/'+t).push();await r.set({phone:currentPassenger.phone,name:pd.name||currentPassenger.name,seats:1,status:'pending',date:t,pickupLocation:pickup,createdAt:nowMs()});showToast('✅ 已送出，等待司機確認',3000);renderBookingContent();}catch(e){showToast('❌ '+e.message);}}
async function paxLoopCancel(){if(!confirm('確定取消留位？'))return;try{const t=getToday();const all=await db.ref('booking_loop/'+t).once('value').then(s=>s.val()||{});const my=Object.values(all).find(x=>x.phone===currentPassenger.phone&&(x.status==='pending'||x.status==='reserved'));if(my){await db.ref('booking_loop/'+t+'/'+my.id).remove();const cur=await db.ref('booking_passengers/'+currentPassenger.phone+'/cancels/'+t).once('value').then(s=>s.val()||0);await db.ref('booking_passengers/'+currentPassenger.phone+'/cancels/'+t).set(cur+1);}showToast('已取消留位');renderBookingContent();}catch(e){showToast('取消失敗：'+e.message);}}
async function paxLoopBoarded(){if(!confirm('確定你已上車？'))return;try{const t=getToday();const all=await db.ref('booking_loop/'+t).once('value').then(s=>s.val()||{});const my=Object.values(all).find(x=>x.phone===currentPassenger.phone&&x.status==='reserved');if(!my){showToast('搵唔到留位記錄');return;}await db.ref('booking_loop/'+t+'/'+my.id).update({status:'boarded',boardedAt:nowMs()});showToast('✅ 已上車');renderBookingContent();}catch(e){showToast('❌ '+e.message);}}
async function paxBoarded(id,d){if(!confirm('確定你已上車？'))return;try{await db.ref('booking/'+d+'/'+id).update({status:'boarded',boardedAt:nowMs()});await db.ref('booking/'+d+'/'+id+'/passengerLocation').remove();showToast('✅ 已上車');renderBookingContent();}catch(e){showToast('失敗：'+e.message);}}
async function paxCancelBooking(id,d){if(!confirm('確定取消預約？'))return;try{const b=await db.ref('booking/'+d+'/'+id).once('value').then(s=>s.val());await db.ref('booking/'+d+'/'+id).update({status:'cancelled',cancelledAt:nowMs()});if(b&&b.status==='reserved'){const cfg=await db.ref('booking_seats/'+d+'/'+b.time.replace(':','')).once('value').then(s=>s.val());if(cfg&&cfg.plate){await db.ref('van/active_buses/'+cfg.plate+'/passengerCount').transaction(c=>Math.max(0,(c||0)-(b.seats||1)));}await db.ref('booking/'+d+'/'+id+'/passengerLocation').remove();}const t=d||getToday();const cur=await db.ref('booking_passengers/'+currentPassenger.phone+'/cancels/'+t).once('value').then(s=>s.val()||0);await db.ref('booking_passengers/'+currentPassenger.phone+'/cancels/'+t).set(cur+1);showToast('已取消預約');renderBookingContent();}catch(e){showToast('取消失敗：'+e.message);}}
function setupRecorderUI(id,onSend){const btn=document.getElementById('btn-'+id+'-record');const ctrl=document.getElementById(id+'-record-controls');const stopBtn=document.getElementById(id+'-stop');const cancelBtn=document.getElementById(id+'-cancel');if(!btn)return;RecorderManager.create(id,onSend);btn.addEventListener('click',()=>{const r=RecorderManager.get(id);if(r.isRecording())return;r.start();if(ctrl)ctrl.style.display='flex';btn.style.display='none';});if(stopBtn)stopBtn.addEventListener('click',()=>{const r=RecorderManager.get(id);if(r&&r.isRecording())r.stop();if(ctrl)ctrl.style.display='none';btn.style.display='block';});if(cancelBtn)cancelBtn.addEventListener('click',()=>{const r=RecorderManager.get(id);if(r&&r.isRecording())r.cancel();if(ctrl)ctrl.style.display='none';btn.style.display='block';});}
function startGPS(id,d,t){if(!navigator.geolocation){return;}const g=getGPS(t);stopGPS();gpsMarkedBookingId=null;gpsWatchId=navigator.geolocation.watchPosition(async pos=>{const dd=calcDistance(pos.coords.latitude,pos.coords.longitude,g.lat,g.lng);const n=nowMs();if(n-gpsLastWrite>CONFIG.TRACK_INTERVAL){gpsLastWrite=n;db.ref('booking/'+d+'/'+id+'/passengerLocation').update({lat:pos.coords.latitude,lng:pos.coords.longitude,distance:Math.round(dd),accuracy:Math.round(pos.coords.accuracy||0),updatedAt:n,arrived:dd<=CONFIG.GPS_R,name:currentPassenger?currentPassenger.name:'',phone:currentPassenger?currentPassenger.phone:'',time:t}).catch(()=>{});}if(dd<=CONFIG.GPS_R){if(gpsMarkedBookingId!==id){gpsMarkedBookingId=id;try{const b=await db.ref('booking/'+d+'/'+id).once('value').then(s=>s.val());if(b&&b.status==='reserved'){await db.ref('booking/'+d+'/'+id).update({status:'arrived',arrivedAt:nowMs(),arrivedLat:pos.coords.latitude,arrivedLng:pos.coords.longitude,arrivedAuto:true});showToast('✅ 已自動確認到站！',3000);}}catch(e){}}}},err=>{console.warn('GPS 錯誤:',err.message);},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});}
function stopGPS(){if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}}
document.getElementById('passenger-login-btn').addEventListener('click',async function(){const ph=document.getElementById('passenger-phone').value.trim();const nm=document.getElementById('passenger-name').value.trim();const er=document.getElementById('passenger-login-error');if(!ph||!/^\d{8,}$/.test(ph)){er.textContent='請輸入 8 位數字電話號碼';return;}if(!nm||nm.length>20){er.textContent='請輸入姓名（20字內）';return;}try{await auth.signInAnonymously();const uid=auth.currentUser.uid;currentUser.uid=uid;currentUser.identifier=ph;currentUser.role='passenger';currentPassenger={phone:ph,name:nm};await db.ref('users/'+uid).set({identifier:ph,role:'passenger',lastLogin:nowMs()});const ex=await db.ref('booking_passengers/'+ph).once('value').then(s=>s.val()||{});await db.ref('booking_passengers/'+ph).update({name:nm,phone:ph,creditScore:ex.creditScore!=null?ex.creditScore:100,lastLogin:nowMs()});document.getElementById('login-modal').classList.remove('active');document.getElementById('pax-user-info').textContent='👤 '+nm+' ('+ph+')';showToast('✅ 登入成功，歡迎 '+nm);if(voiceEnabled)speakCantonese(VOICE_TEXTS.welcomePassenger);renderBookingContent();}catch(e){er.textContent='登入失敗：'+e.message;}});
document.getElementById('pax-tab-list').addEventListener('click',()=>switchPaxTab('list'));
document.getElementById('pax-tab-booking').addEventListener('click',()=>switchPaxTab('booking'));
document.getElementById('btn-refresh-buslist').addEventListener('click',function(){showToast('🔄 重新整理中...');if(busListRef){try{busListRef.off();}catch(e){}}loadBusList();});
document.getElementById('btn-back-list').addEventListener('click',function(){if(passengerMsgRef){try{passengerMsgRef.off();}catch(e){}}if(passengerBusRef){try{passengerBusRef.off();}catch(e){}}showView('view-passenger-list');loadBusList();});
document.getElementById('btn-pass-send').addEventListener('click',function(){const input=document.getElementById('pass-msg-input');const text=input?input.value.trim():'';if(!text||!currentBusId)return;db.ref('van/messages').push({busId:currentBusId,senderUid:currentUser.uid,senderIdentifier:currentUser.identifier,text:text,timestamp:nowMs(),type:'text'}).then(()=>{input.value='';showToast('已發送');});});
document.getElementById('global-voice-btn').addEventListener('click',function(){voiceEnabled=!voiceEnabled;this.textContent=voiceEnabled?'🔊':'🔇';this.classList.toggle('muted',!voiceEnabled);showToast(voiceEnabled?'語音已開啟':'語音已關閉');try{localStorage.setItem('globalVoice',voiceEnabled?'on':'off');}catch(e){}if(!voiceEnabled&&window.speechSynthesis)window.speechSynthesis.cancel();});
if(localStorage.getItem('globalVoice')==='off'){voiceEnabled=false;const b=document.getElementById('global-voice-btn');if(b){b.textContent='🔇';b.classList.add('muted');}}
db.ref('.info/connected').on('value',snap=>{const s=document.getElementById('connection-status');if(!s)return;if(snap.val()){s.textContent='🟢 已連線';s.className='connection-status online';setTimeout(()=>{s.style.display='none';},2500);}else{s.textContent='🔴 網絡中斷';s.className='connection-status offline';s.style.display='block';}});
auth.onAuthStateChanged(function(user){if(user){db.ref('users/'+user.uid).once('value').then(snap=>{const d=snap.val();if(d&&d.role==='passenger'){currentUser.uid=user.uid;currentUser.identifier=d.identifier;currentUser.role='passenger';currentPassenger={phone:d.identifier,name:d.name||d.identifier};document.getElementById('login-modal').classList.remove('active');document.getElementById('pax-user-info').textContent='👤 '+(d.name||d.identifier)+' ('+d.identifier+')';renderBookingContent();}});}else{document.getElementById('login-modal').classList.add('active');}});
window.renderBookingContent=renderBookingContent;
window.paxSelectShift=paxSelectShift;
window.paxConfirmBooking=paxConfirmBooking;
window.paxLoopJoin=paxLoopJoin;
window.paxLoopCancel=paxLoopCancel;
window.paxLoopBoarded=paxLoopBoarded;
window.paxBoarded=paxBoarded;
window.paxCancelBooking=paxCancelBooking;
loadBusList();
console.log('✅ 乘客版 v1.0 已就緒');
</script>
